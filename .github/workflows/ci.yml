name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        # The package itself has no runtime dependencies; only the test and
        # lint tooling needs installing.
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint
        run: ruff check src tests

      - name: Test
        # No network access in CI. Every test runs against fixtures or pure
        # functions -- a test suite that needs a volunteer-run API to pass is
        # a test suite that fails on their maintenance window.
        run: python -m pytest
